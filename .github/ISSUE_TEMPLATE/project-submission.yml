name: Project submission / 项目投稿
description: Recommend an open-source AI × hardware project / 推荐开源 AI × 硬件项目
title: "[Project]: "
labels:
  - candidate
body:
  - type: markdown
    attributes:
      value: |
        Thank you for contributing. Submit one project per Issue and read CONTRIBUTING.md first.
        感谢投稿。一次只提交一个项目；提交前请阅读 CONTRIBUTING.zh-CN.md。
  - type: input
    id: repo
    attributes:
      label: GitHub repository URL / GitHub 仓库 URL
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: One-sentence summary / 一句话说明
      description: State factually what the AI does and what the hardware is. / 用事实说明 AI 做什么、硬件是什么。
    validations:
      required: true
  - type: textarea
    id: ai-role
    attributes:
      label: Role of AI / AI 的具体作用
      description: What model or agent is used, and what does it do in the core execution path? / 使用什么模型或 Agent，它完成什么任务？
    validations:
      required: true
  - type: textarea
    id: hardware-role
    attributes:
      label: Role of hardware / 硬件的具体作用
      description: What device does the project read or control, and where are its designs or firmware? / 项目读取或控制什么设备？硬件设计或固件在哪里？
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: Open-source license / 开源许可证
      placeholder: MIT (include the location of the LICENSE file / 请注明 LICENSE 文件位置)
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Original post or demo URL / 原始分享或演示 URL
      description: Provide the original X, blog, or video URL for such claims. / 如果声称来自相关分享，请提供原始链接。
  - type: textarea
    id: resources
    attributes:
      label: Media resources / 图文与视频资源
      description: Optional. Add one original image, video, demo, article, or documentation URL per line. / 可选，每行一个原始资源 URL。
      placeholder: |
        Video: https://example.com/video
        Images: https://example.com/gallery
  - type: dropdown
    id: category
    attributes:
      label: Suggested primary category / 建议主分类
      options:
        - Smart Home and IoT / 智能家居与 IoT
        - AI Wearables / AI 可穿戴设备
        - Voice Assistants and AI Companions / 语音助手与 AI 伴侣
        - Robotics and Embodied AI / 机器人与具身智能
        - Edge AI and Microcontrollers / 边缘 AI 与微控制器
        - Protocols and Infrastructure / 协议与基础设施
        - Status Displays and Creative Hardware / 状态可视化与创意硬件
    validations:
      required: true
  - type: dropdown
    id: relationship
    attributes:
      label: Your relationship to the project / 你与项目的关系
      options:
        - No relationship, recommendation only / 无关系，仅推荐
        - Author or maintainer / 项目作者或维护者
        - Member of the organization / 所属组织成员
        - Another relevant relationship / 其他利益关系
    validations:
      required: true
  - type: textarea
    id: reproducibility
    attributes:
      label: Reproducibility evidence / 复现依据
      description: Point to installation, build, BOM, wiring, firmware, or architecture documentation. / 请指出相关资料的位置。
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission confirmation / 投稿确认
      options:
        - label: I searched existing Issues and entries and found no duplicate. / 我已确认没有重复投稿。
          required: true
        - label: I read the contribution guide and confirmed that the project meets every mandatory requirement. / 我已阅读贡献指南并确认项目符合强制门槛。
          required: true
        - label: My disclosure is accurate, and no benefit was offered in exchange for inclusion. / 我披露的信息真实，且没有以收录换取利益。
          required: true
